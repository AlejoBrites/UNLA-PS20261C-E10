{% extends 'base.html' %}

{% block title %}Iniciar sesión — SteamWeb{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-secondary bg-opacity-10 border-secondary">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-white">
                    <i class="bi bi-person-lock me-2"></i>Iniciar sesión
                </h3>
                <form class="text-white" method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 mt-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                    </button>
                </form>
                <hr class="border-secondary mt-4">
                <p class="text-center text-secondary mb-0">
                    ¿No tenés cuenta?
                    <a href="{% url 'users:register' %}" class="text-light">Registrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
